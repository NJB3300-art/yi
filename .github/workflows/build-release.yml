name: Build and Release (Xbox UWP)

# Builds the open-source moonlight-xbox client (GPL) with the blade theme patch,
# bundles the Dev Mode dependencies, and publishes a GitHub Release.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout this repo (patches)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout moonlight-xbox (upstream source)
        uses: actions/checkout@v4
        with:
          repository: TheElixZammuto/moonlight-xbox
          path: src
          fetch-depth: 0
          submodules: recursive

      - name: Apply blade theme patch
        working-directory: src
        run: git apply --whitespace=nowarn ../self/patches/blade-theme.patch

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore prebuilt vcpkg packages
        working-directory: src
        run: |
          Invoke-WebRequest -Uri "https://github.com/TheElixZammuto/moonlight-xbox/releases/download/1.10.0/vcpkg_installed.zip" -OutFile vcpkg_installed.zip
          Expand-Archive vcpkg_installed.zip -DestinationPath .\

      - name: Bootstrap vcpkg and build third-party projects
        working-directory: src
        run: |
          .\vcpkg\bootstrap-vcpkg.bat
          .\generate-thirdparty-projects.bat

      - name: Restore NuGet
        working-directory: src
        run: nuget restore .

      - name: Create self-signed signing certificate
        working-directory: src
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=CE07B73A-712E-4E05-932B-D08CE2C8A87C" -KeyUsage DigitalSignature -FriendlyName "MoonlightUWP" -CertStoreLocation "Cert:\LocalMachine\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = [guid]::NewGuid().ToString("N")
          "CERT_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
          Export-PfxCertificate -Cert "Cert:\LocalMachine\My\$($cert.Thumbprint)" -FilePath cert.pfx -Password (ConvertTo-SecureString -String $pw -AsPlainText -Force)
          Export-Certificate -Cert "Cert:\LocalMachine\My\$($cert.Thumbprint)" -FilePath moonlight-xbox-signing.cer

      - name: Build msixbundle
        working-directory: src
        run: |
          msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:AppxBundle=Always /p:AppxPackageDir=output /p:PackageCertificateKeyFile=cert.pfx /p:PackageCertificatePassword=$env:CERT_PW /p:UapAppxPackageBuildMode=SideLoadOnly .

      - name: Collect release files (app + dependencies)
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path ..\release | Out-Null
          # Bundle plus the Dependencies folder (VCLibs / UI.Xaml appx files) produced by the sideload build
          Get-ChildItem -Path output -Recurse -Include *.msixbundle,*.appxbundle | Copy-Item -Destination ..\release
          Get-ChildItem -Path output -Recurse -Directory -Filter Dependencies | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -Filter *.appx | Where-Object { $_.FullName -match 'x64' } | Copy-Item -Destination ..\release
          }
          Copy-Item moonlight-xbox-signing.cer ..\release
          Copy-Item LICENSE ..\release\LICENSE-moonlight-xbox
          dir ..\release

      - name: Zip release files
        run: Compress-Archive -Path release\* -DestinationPath moonlight-xbox-blade-xbox-uwp.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Moonlight Xbox (blade theme) ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Xbox Dev Mode build of moonlight-xbox (GPL) with the blade theme applied.
            Install with Xbox Device Portal: upload the .msixbundle, add the dependency .appx files (VCLibs, UI.Xaml), install.
            The signing certificate (.cer) is self-signed and only needed if you sideload on a PC.
            Streams from a Sunshine host (your PC or a cloud VM). Does not contain any game files.
          files: |
            moonlight-xbox-blade-xbox-uwp.zip
            release/*.msixbundle
            release/*.appxbundle
            release/*.appx
            release/*.cer
          fail_on_unmatched_files: false
